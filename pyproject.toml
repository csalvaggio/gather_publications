[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gather-publications"
version = "0.1.0"
description = "Maintain a verified author(s) publication database and generate annual bibliographies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
]

[project.scripts]
gather-publications = "gather_publications.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gather_publications*"]
